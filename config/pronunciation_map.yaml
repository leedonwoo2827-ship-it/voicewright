# voicewright 발음 사전
#
# 합성 직전에 텍스트의 약자·외래어를 한국어 발음으로 자동 치환합니다.
# Supertonic은 영문 약자를 음절 단위로 읽는 경향이 있어 (예: MOOC → "엠오오씨"),
# 자연스러운 발음을 원하면 여기에 등록해두세요.
#
# 동작 규칙
#   - 단어 경계(\b) 매칭 — "MOOC"는 잡지만 "MOOCAR" 같은 합성어 일부는 안 잡힘
#   - SRT 자막에는 적용되지 않음 (자막에는 항상 원본 텍스트가 들어감)
#   - 사용자가 카드에서 직접 텍스트를 편집한 경우엔 편집 결과가 우선 (이중 변환은 자연스럽게 누적)
#   - 새 항목 추가 후엔 즉시 반영 (서버 재시작 불필요)

rules:
  # 학습 / 교육
  MOOC: 무크
  LMS: 엘엠에스
  GPA: 지피에이
  TOEIC: 토익
  TOEFL: 토플
  IELTS: 아이엘츠

  # 방송 / 미디어
  BBC: 비비씨
  KBS: 케이비에스
  MBC: 엠비씨
  SBS: 에스비에스
  EBS: 이비에스
  YTN: 와이티엔
  CNN: 씨엔엔
  NHK: 엔에이치케이

  # IT / 인터넷
  AI: 에이아이
  GPU: 지피유
  CPU: 씨피유
  URL: 유알엘
  JSON: 제이슨
  API: 에이피아이
  HTTP: 에이치티티피
  HTTPS: 에이치티티피에스
  SDK: 에스디케이
  IDE: 아이디이
  USB: 유에스비
  PDF: 피디에프
  XML: 엑스엠엘

  # 기관 / 조직
  CERN: 세른
  NASA: 나사
  MIT: 엠아이티
  ICS: 아이씨에스
  WHA: 더블유에이치에이
  IBM: 아이비엠
  OECD: 오이씨디
  WHO: 더블유에이치오

  # 기술 / 포맷
  ADSL: 에이디에스엘
  BGM: 비지엠
  OST: 오에스티
  MV: 엠브이
  MC: 엠씨
  RSS: 알에스에스
  CCTV: 씨씨티브이
  GPS: 지피에스
  VR: 브이알
  AR: 에이알

  # 한글로 자주 쓰이는 외래어 (선택사항 — 발음이 어색하면 등록)
  # 예: ChatGPT → 챗지피티
