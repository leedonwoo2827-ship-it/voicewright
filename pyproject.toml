[project]
name = "voicewright"
version = "0.1.0"
description = "Local Korean TTS service for the storylens/scriptforge/sceneweaver pipeline"
requires-python = ">=3.11,<3.14"
authors = [{ name = "leedonwoo2827-ship-it" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
  # supertonic 엔진은 vendor (src/voicewright/_vendor/supertonic_helper.py, MIT)
  # onnxruntime은 [gpu] / [cpu] extras에서 골라 설치
  "numpy>=1.26",
  "soundfile>=0.12.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17"]
cpu = ["onnxruntime>=1.17"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
voicewright = "voicewright.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicewright"]
